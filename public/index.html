<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VitalTelecom Accounting</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f8;--card:#fff;--tx:#0f1b2d;--mu:#64748b;--pr:#1560d4;--pr2:#0a3d91;--bd:#dde5f0;--ok:#0f9d58;--bad:#d93025;--hs:#e8590c;--sh:0 2px 10px rgba(15,27,45,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1320;--card:#152135;--tx:#e8eef7;--mu:#93a3b8;--pr:#4da3ff;--pr2:#16408a;--bd:#263650;--sh:none}}
:root[data-theme="dark"]{--bg:#0b1320;--card:#152135;--tx:#e8eef7;--mu:#93a3b8;--pr:#4da3ff;--pr2:#16408a;--bd:#263650;--sh:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:15px;line-height:1.6}
header{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;padding:14px 16px}
.hi{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}header small{opacity:.85}.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:13px;background:rgba(255,255,255,.18);color:#fff;border:0;padding:6px 13px;border-radius:20px;font-family:inherit;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:var(--sh)}
nav button,.seg button{flex:none;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px 16px;border-radius:22px;font:inherit;cursor:pointer}
nav button.on,.seg button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg button.on.hs{background:var(--hs);border-color:var(--hs)}
main{max-width:1000px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh);border-top:4px solid var(--pr)}
.stat.h{border-top-color:var(--hs)}.stat span{color:var(--mu);font-size:13px}.stat b{display:block;font-size:22px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:64px;resize:vertical}
.btn{background:var(--pr);color:#fff;border:0;padding:11px 22px;border-radius:9px;font:inherit;cursor:pointer;margin-top:14px}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:17px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;text-align:start;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600}
.tag{padding:2px 9px;border-radius:10px;font-size:12px;background:var(--bg);border:1px solid var(--bd)}
.ok{color:var(--ok)}.bad{color:var(--bad)}h3{margin:0 0 8px;font-size:16px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.msg{max-width:420px;margin:40px auto;text-align:center}.msg .ic{font-size:42px}.msg p{color:var(--mu)}.err{color:var(--bad);font-size:13px;min-height:18px}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:0 2px 14px rgba(10,61,145,.35)}
.hl{display:flex;align-items:center;gap:12px}
.burger{display:none;width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.18);cursor:pointer;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0}
.burger.show{display:flex}.burger i{display:block;width:20px;height:2.5px;background:#fff;border-radius:2px}
#lo{display:none!important}
#ov{position:fixed;inset:0;background:rgba(5,12,25,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}#ov.open{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(300px,82vw);background:var(--card);z-index:50;transition:transform .28s ease;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 30px rgba(0,0,0,.3);overflow-y:auto}
[dir=rtl] #dr{transform:translateX(100%)}[dir=ltr] #dr{transform:translateX(-100%)}#dr.open{transform:none!important}
.dh{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:2px}.dh button{border:0;background:var(--bg);color:var(--tx);width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer}
.du{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;padding:12px 14px;border-radius:12px;margin-bottom:8px;font-size:14px}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:0;background:none;color:var(--tx);font:inherit;font-size:16px;padding:13px 12px;border-radius:12px;cursor:pointer}
.mi span{font-size:20px;width:26px;text-align:center}.mi:hover{background:var(--bg)}.mi.on{background:var(--pr);color:#fff}
.df{margin-top:auto;border-top:1px solid var(--bd);padding-top:8px}
.hero{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;border-radius:18px;padding:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--sh)}
.hero h2{margin:0 0 4px;font-size:20px}.hero p{margin:0;opacity:.85;font-size:14px}.hero input{background:rgba(255,255,255,.95);color:#0f1b2d;border:0;min-width:160px}
.stat{display:flex;flex-direction:column;gap:2px;position:relative;transition:transform .15s}.stat:hover{transform:translateY(-2px)}.stat .si{font-size:22px;margin-bottom:2px}
.sec{margin:18px 2px 10px;font-size:15px;color:var(--mu)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 10px;font:inherit;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.tile span{font-size:30px}.tile:hover{transform:translateY(-3px);border-color:var(--pr)}
.card{border-radius:16px}.btn{border-radius:11px;box-shadow:0 3px 10px rgba(21,96,212,.3)}
@media(min-width:900px){main{padding:22px}.stat b{font-size:26px}}
@media(max-width:600px){main{padding:10px}.stat b{font-size:18px}}
@media print{nav,header,.np{display:none}body{background:#fff}}
</style>
</head>
<body>
<header><div class="hi"><div class="hl"><button class="burger" id="bg" onclick="menu()" aria-label="menu"><i></i><i></i><i></i></button><div><h1>VitalTelecom Accounting</h1><small id="sub"></small></div></div><div class="hr"><span class="chip" id="usr" style="display:none"></span><button class="chip" id="lg" onclick="toggleLang()"></button><button class="chip" id="lo" style="display:none" onclick="logout()"></button></div></div></header>
<nav id="nav" style="display:none"></nav><div id="ov" onclick="menu(false)"></div><aside id="dr"></aside>
<main id="app"></main><div id="toast" style="position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 20px;border-radius:24px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20"></div>
<script>
const L={
sub:['د PPPoE او هاټ سپاټ حساب ډاري','PPPoE & Hotspot billing and accounting'],
dash:['ډشبورډ','Dashboard'],reg:['راجسټریشن','Registration'],col:['پیسې راټولول','Collection'],exp:['لګښتونه','Expenses'],rep:['میاشتنی راپور','Monthly Report'],prc:['د پیکجونو نرخ','Package Prices'],
pppoe:['PPPoE','PPPoE'],hotspot:['هاټ سپاټ','Hotspot'],month:['میاشت','Month'],
cnt_pppoe:['PPPoE مشتریان','PPPoE customers'],cnt_hotspot:['هاټ سپاټ مشتریان','Hotspot customers'],inc_pppoe:['PPPoE عاید','PPPoE income'],inc_hotspot:['هاټ سپاټ عاید','Hotspot income'],
expense:['لګښت','Expenses'],net:['خالص ګټه','Net profit'],welcome:['ښه راغلاست','Welcome'],
wtext:['ستاسو ډاټا خصوصي ده او آنلاین خوندي کیږي. لومړی «د پیکجونو نرخ» ډک کړئ، بیا په «راجسټریشن» کې مشتریان ثبت کړئ، او په «پیسې راټولول» کې پیسې ثبت کړئ.','Your data is private and saved online. First fill in "Package Prices", then register customers under "Registration" and record payments under "Collection".'],
newc:['نوی مشتری ثبت کړئ','Register new customer'],name:['نوم','Name'],phone:['تلیفون','Phone'],user_pppoe:['PPPoE Username','PPPoE Username'],user_hotspot:['Hotspot User','Hotspot User'],
pkg:['پیکج','Package'],fee:['میاشتنی فیس','Monthly fee'],date:['نېټه','Date'],note:['کمنټ / اضافي معلومات','Comment / extra info'],save:['ثبت','Save'],
customers:['مشتریان','Customers'],nocust:['هیڅ مشتری نشته','No customers yet'],recent:['وروستي پیسې','Recent payments'],
collect:['پیسې راټولول','Collect payment'],customer:['مشتری','Customer'],amount:['مبلغ','Amount'],collected:['راټول شو','Record payment'],firstc:['لومړی مشتری ثبت کړئ','Register a customer first'],
desc:['تشریح','Description'],descph:['بریښنا، بانډویډت، معاش...','Electricity, bandwidth, salary...'],addexp:['لګښت ثبت کړئ','Add expense'],
print:['چاپ / PDF','Print / PDF'],report_of:['میاشتنی راپور','Monthly report'],total:['ټول عاید','Total income'],
col_pppoe:['PPPoE راټول شوي','PPPoE collected'],col_hotspot:['هاټ سپاټ راټول شوي','Hotspot collected'],unpaid:['PPPoE مشتریان چې نه دي ورکړي','PPPoE customers not paid'],allpaid:['ټولو ورکړي ✓','Everyone has paid ✓'],
ptext:['د هر پیکج میاشتنی نرخ ولیکئ. د مشتري ثبتولو پر مهال به پخپله ډکیږي.','Enter the monthly price of each package. It fills in automatically when you register a customer.'],
pp_title:['PPPoE — نامحدود (1 څخه تر 12 Mbps)','PPPoE — Unlimited (1 to 12 Mbps)'],hs_title:['هاټ سپاټ','Hotspot'],
unl:['نامحدود','Unlimited'],
confirm:['حذف شي؟','Delete?'],sure:['حذف؟ بیا کلیک','Delete? tap again'],deleted:['حذف شو','Deleted'],dl:['د راپور فایل ډاونلوډ (HTML)','Download report file (HTML)'],csv:['ډاونلوډ CSV (Excel)','Download CSV (Excel)'],dlnote:['که چاپ نه کار کوي، فایل ډاونلوډ کړئ، پرانیزئ او له براوزر څخه چاپ / PDF وکړئ.','If Print does nothing, download the file, open it and print / save as PDF from your browser.'],needname:['نوم ولیکئ','Enter a name'],needamt:['مشتری او مبلغ ډک کړئ','Select a customer and enter an amount'],
loading:['لوډ کیږي...','Loading...'],
needsign:['د ننوتلو لپاره باید د Claude حساب سره ننوځئ او دا پاڼه بیا پرانیزئ. که حساب نه لرئ، د پاڼې مالک باید تاسو دعوت کړي.','To use this app, sign in with your Claude account and reopen this page. If you have no access, the page owner must invite you.'],
readerr:['ډاټا لوستل ونه شول. انټرنیټ یا اجازه وګورئ.','Could not load data. Check your connection or permissions.'],
login:['ننوتل','Log in'],signup:['نوی حساب جوړول','Create account'],username:['یوزرنیم','Username'],password:['پاسورډ','Password'],confirmpw:['پاسورډ بیا ولیکئ','Confirm password'],
su_text:['لومړی خپل یوزرنیم او پاسورډ جوړ کړئ. ځکه چې پاسورډ نشي بیرته ترلاسه کیدلی، یې په یاد ولرئ.','Create your username and password. The password cannot be recovered, so remember it.'],
li_text:['خپل یوزرنیم او پاسورډ ولیکئ.','Enter your username and password.'],
e_short:['یوزرنیم ولیکئ او پاسورډ لږ تر لږه 6 توري وي','Enter a username and a password of at least 6 characters'],e_match:['پاسورډونه سره نه جوړیږي','Passwords do not match'],e_bad:['یوزرنیم یا پاسورډ ناسم دی','Wrong username or password'],
e_exists:['دا یوزرنیم مخکې شته','This username already exists'],e_rate:['ډیرې هڅې. وروسته بیا هڅه وکړئ','Too many attempts. Try again later'],haveacc:['حساب لرم — ننوتل','I have an account — Log in'],noacc:['حساب نه لرم — نوی حساب جوړول','No account — Create one'],logout:['وتل','Log out'],lang:['English','پښتو'],saved:['✓ خوندي شو','✓ Saved'],savefail:['⚠️ خوندي نشو','⚠️ Not saved'],hello:['👤 ','👤 '],quick:['ګړندۍ لارې','Quick actions']
};
const PK={pppoe:Array.from({length:12},(_,i)=>({id:'p'+(i+1),n:(i+1)+' Mbps'})),hotspot:[{id:'h10',n:'10 GB'},{id:'hu3',n:'3 Mbps'}]};
let lang='ps';try{lang=localStorage.getItem('vt_lang')||'ps'}catch(e){}
const t=k=>L[k]?L[k][lang==='ps'?0:1]:k;
const pname=id=>{const p=[...PK.pppoe,...PK.hotspot].find(p=>p.id===id);if(!p)return '—';return id==='h10'?p.n:t('unl')+' '+p.n};
const IC={dash:'📊',reg:'📝',col:'💰',exp:'🧾',rep:'📈',prc:'🏷️'};
const NAV=['dash','reg','col','exp','rep','prc'];
let S={customers:[],payments:[],expenses:[],prices:{}},tab='dash',cat='pppoe',rm=new Date().toISOString().slice(0,7),db=null,uid=null,ready=false,sv=null,auth=null,uname='',phase='load';
const $=id=>document.getElementById(id),nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const money=n=>(+n||0).toLocaleString('en-US'),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cust=id=>S.customers.find(c=>c.id===id),sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0);
const mp=(m,ty)=>S.payments.filter(p=>p.month===m&&(!ty||cust(p.cid)?.type===ty));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256))}

function chrome(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ps'?'rtl':'ltr';
  $('sub').textContent=t('sub');$('lg').textContent=t('lang');$('lo').textContent=t('logout');
  $('lo').style.display=ready?'':'none';$('bg').classList.toggle('show',ready);$('usr').style.display=ready?'':'none';$('usr').textContent='👤 '+uname;
}
function toggleLang(){lang=lang==='ps'?'en':'ps';try{localStorage.setItem('vt_lang',lang)}catch(e){}render()}
function msg(ic,tx){$('nav').innerHTML='';$('app').innerHTML=`<div class="msg card"><div class="ic">${ic}</div><p>${tx}</p></div>`}
function authView(signup){
  $('nav').innerHTML='';
  $('app').innerHTML=`<div class="msg card"><div class="ic">🔐</div><h3>${signup?t('signup'):t('login')}</h3><p>${signup?t('su_text'):t('li_text')}</p>
  <label>${t('username')}</label><input id="au" autocomplete="username"><label>${t('password')}</label><input id="ap" type="password" autocomplete="${signup?'new-password':'current-password'}">
  ${signup?`<label>${t('confirmpw')}</label><input id="ap2" type="password" autocomplete="new-password">`:''}
  <div class="err" id="er"></div><button class="btn" onclick="${signup?'doSignup()':'doLogin()'}">${signup?t('signup'):t('login')}</button><p><a href="#" onclick="phase='${signup?'login':'signup'}';render();return false" style="color:var(--pr)">${signup?t('haveacc'):t('noacc')}</a></p></div>`;
}
async function api(p,m,b){const r=await fetch('/api/'+p,{method:m||'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,credentials:'same-origin'});let d={};try{d=await r.json()}catch(e){}return{ok:r.ok,d}}
async function doSignup(){
  const u=$('au').value.trim(),p=$('ap').value;
  if(u.length<2||p.length<6)return $('er').textContent=t('e_short');
  if(p!==$('ap2').value)return $('er').textContent=t('e_match');
  const r=await api('signup','POST',{u,p});
  if(!r.ok)return $('er').textContent=r.d.error==='exists'?t('e_exists'):t('e_short');
  enter();
}
async function doLogin(){
  const r=await api('login','POST',{u:$('au').value.trim(),p:$('ap').value});
  if(!r.ok)return $('er').textContent=r.d.error==='rate'?t('e_rate'):t('e_bad');
  enter();
}
async function enter(){
  let r;try{r=await api('state')}catch(e){return msg('⚠️',t('readerr'))}
  if(!r.ok){phase='login';return render()}
  S=Object.assign({customers:[],payments:[],expenses:[],prices:{}},r.d.state||{});uname=r.d.username;ready=true;phase='app';render();
}
async function logout(){try{await api('logout','POST')}catch(e){}ready=false;uname='';S={customers:[],payments:[],expenses:[],prices:{}};phase='login';render()}
async function init(){chrome();msg('⏳',t('loading'));let r;try{r=await api('state')}catch(e){return msg('⚠️',t('readerr'))}if(r.ok)return enter();phase='login';render()}
function save(){
  clearTimeout(sv);sv=setTimeout(async()=>{const tx=m=>{$('usr').textContent='👤 '+uname+'  '+m};
    try{const r=await api('state','PUT',{state:S});if(r.ok)tx(t('saved'));else{if(r.d.error==='auth'){phase='login';ready=false;return render()}tx(t('savefail'))}}catch(e){tx(t('savefail'))}
    setTimeout(()=>$('usr').textContent='👤 '+uname,1800)},300)
}
function nav(){
  $('dr').innerHTML=`<div class="dh"><b>📡 VitalTelecom</b><button onclick="menu(false)">✕</button></div><div class="du">👤 ${esc(uname)}</div>`+NAV.map(k=>`<button class="mi ${k===tab?'on':''}" onclick="go('${k}')"><span>${IC[k]}</span>${t(k)}</button>`).join('')+`<div class="df"><button class="mi" onclick="toggleLang()"><span>🌐</span>${t('lang')}</button><button class="mi" onclick="menu(false);logout()"><span>🚪</span>${t('logout')}</button></div>`;
}
function menu(o){const open=o===undefined?!$('dr').classList.contains('open'):o;$('dr').classList.toggle('open',open);$('ov').classList.toggle('open',open)}
function go(k){tab=k;menu(false);render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
function seg(){return `<div class="seg np"><button class="${cat==='pppoe'?'on':''}" onclick="cat='pppoe';render()">${t('pppoe')}</button><button class="hs ${cat==='hotspot'?'on':''}" onclick="cat='hotspot';render()">${t('hotspot')}</button></div>`}
function dash(){
  const m=rm,h=sum(mp(m,'hotspot')),p=sum(mp(m,'pppoe')),e=sum(S.expenses.filter(x=>x.date.startsWith(m)));const n=ty=>S.customers.filter(c=>c.type===ty).length;
  const st=(ic,l,v,c,hs)=>`<div class="stat ${hs?'h':''}"><span class="si">${ic}</span><span>${l}</span><b class="${c||''}">${v}</b></div>`;
  return `<div class="hero"><div><h2>${t('welcome')}، ${esc(uname)} 👋</h2><p>${t('sub')}</p></div><div class="np"><input type="month" value="${m}" onchange="rm=this.value;render()"></div></div>
  <div class="grid">${st('🌐',t('cnt_pppoe'),n('pppoe'))}${st('📶',t('cnt_hotspot'),n('hotspot'),'',1)}${st('💵',t('inc_pppoe'),money(p))}${st('💵',t('inc_hotspot'),money(h),'',1)}${st('🧾',t('expense'),money(e),'bad')}${st('✅',t('net'),money(h+p-e),h+p-e>=0?'ok':'bad')}</div>
  <h3 class="sec">${t('quick')}</h3><div class="tiles">${['reg','col','exp','rep','prc'].map(k=>`<button class="tile" onclick="go('${k}')"><span>${IC[k]}</span>${t(k)}</button>`).join('')}</div>`;
}
function reg(){
  const pk=PK[cat],cs=S.customers.filter(c=>c.type===cat);
  return seg()+`<div class="card"><h3>${t('newc')} — ${t(cat)}</h3>
  <div class="row"><div><label>${t('name')}</label><input id="n"></div><div><label>${t('phone')}</label><input id="ph" inputmode="tel"></div><div><label>${t('user_'+cat)}</label><input id="u"></div></div>
  <div class="row"><div><label>${t('pkg')}</label><select id="pk" onchange="$('fee').value=S.prices[this.value]||''">${pk.map(p=>`<option value="${p.id}">${pname(p.id)}</option>`).join('')}</select></div>
  <div><label>${t('fee')}</label><input id="fee" type="number" inputmode="numeric" value="${S.prices[pk[0].id]||''}"></div><div><label>${t('date')}</label><input id="d" type="date" value="${today()}"></div></div>
  <label>${t('note')}</label><textarea id="nt"></textarea><button class="btn" onclick="addC()">${t('save')}</button></div>
  <div class="card"><h3>${t('customers')} (${cs.length})</h3><div class="tw"><table><tr><th>${t('name')}</th><th>${t('user_'+cat)}</th><th>${t('pkg')}</th><th>${t('phone')}</th><th>${t('fee')}</th><th>${t('note')}</th><th></th></tr>
  ${cs.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.user)}</td><td><span class="tag">${pname(c.pkg)}</span></td><td>${esc(c.phone)}</td><td>${money(c.fee)}</td><td>${esc(c.note)}</td><td><button class="x" onclick="del('C','${c.id}',this)">✕</button></td></tr>`).join('')||`<tr><td colspan=7>${t('nocust')}</td></tr>`}</table></div></div>`;
}
function col(){
  const cs=S.customers.filter(c=>c.type===cat);
  const opt=cs.map(c=>`<option value="${c.id}">${esc(c.name)} — ${pname(c.pkg)}</option>`).join('');
  const ps=S.payments.filter(p=>cust(p.cid)?.type===cat).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
  return seg()+`<div class="card"><h3>${t('collect')} — ${t(cat)}</h3>
  <div class="row"><div><label>${t('customer')}</label><select id="pc" onchange="$('pa').value=cust(this.value)?.fee||''">${opt||`<option value="">${t('firstc')}</option>`}</select></div>
  <div><label>${t('month')}</label><input id="pm" type="month" value="${rm}"></div><div><label>${t('amount')}</label><input id="pa" type="number" inputmode="numeric" value="${cs[0]?.fee||''}"></div><div><label>${t('date')}</label><input id="pd" type="date" value="${today()}"></div></div>
  <label>${t('note')}</label><textarea id="pn"></textarea><button class="btn" onclick="addP()">${t('collected')}</button></div>
  <div class="card"><h3>${t('recent')}</h3><div class="tw"><table><tr><th>${t('date')}</th><th>${t('customer')}</th><th>${t('month')}</th><th>${t('amount')}</th><th>${t('note')}</th><th></th></tr>
  ${ps.map(p=>`<tr><td>${p.date}</td><td>${esc(cust(p.cid)?.name)}</td><td>${p.month}</td><td>${money(p.amount)}</td><td>${esc(p.note)}</td><td><button class="x" onclick="del('P','${p.id}',this)">✕</button></td></tr>`).join('')||'<tr><td colspan=6>—</td></tr>'}</table></div></div>`;
}
let pend='';
function del(k,id,b){
  if(pend!==k+id){pend=k+id;b.textContent=t('sure');b.style.fontSize='13px';setTimeout(()=>{if(pend===k+id){pend='';b.textContent='✕';b.style.fontSize=''}},3500);return}
  pend='';const y=scrollY;
  if(k==='C'){S.customers=S.customers.filter(c=>c.id!==id);S.payments=S.payments.filter(p=>p.cid!==id)}
  if(k==='P')S.payments=S.payments.filter(p=>p.id!==id);
  if(k==='E')S.expenses=S.expenses.filter(x=>x.id!==id);
  save();render();scrollTo(0,y);toast(t('deleted'));
}
function toast(m){const e=$('toast');e.textContent=m;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2200)}
function addC(){const name=$('n').value.trim();if(!name)return toast(t('needname'));
  S.customers.push({id:nid(),type:cat,name,phone:$('ph').value,user:$('u').value,pkg:$('pk').value,fee:+$('fee').value||0,date:$('d').value,note:$('nt').value});save();render()}
function addP(){const cid=$('pc').value,amount=+$('pa').value;if(!cid||!amount)return toast(t('needamt'));
  S.payments.push({id:nid(),cid,month:$('pm').value,amount,date:$('pd').value,note:$('pn').value});save();render()}
function exp(){return `<div class="card"><h3>${t('addexp')}</h3>
  <div class="row"><div><label>${t('desc')}</label><input id="ed" placeholder="${t('descph')}"></div><div><label>${t('amount')}</label><input id="ea" type="number" inputmode="numeric"></div><div><label>${t('date')}</label><input id="edt" type="date" value="${today()}"></div></div>
  <label>${t('note')}</label><textarea id="en"></textarea><button class="btn" onclick="addE()">${t('save')}</button></div>
  <div class="card"><div class="tw"><table><tr><th>${t('date')}</th><th>${t('desc')}</th><th>${t('amount')}</th><th>${t('note')}</th><th></th></tr>
  ${[...S.expenses].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${x.date}</td><td>${esc(x.desc)}</td><td>${money(x.amount)}</td><td>${esc(x.note)}</td><td><button class="x" onclick="del('E','${x.id}',this)">✕</button></td></tr>`).join('')||'<tr><td colspan=5>—</td></tr>'}</table></div></div>`}
function addE(){const amount=+$('ea').value;if(!amount)return toast(t('needamt'));S.expenses.push({id:nid(),desc:$('ed').value,amount,date:$('edt').value,note:$('en').value});save();render()}
function prc(){const g=(ty,l)=>`<div class="card"><h3>${l}</h3><div class="pk">${PK[ty].map(p=>`<div><label>${pname(p.id)}</label><input type="number" inputmode="numeric" value="${S.prices[p.id]||''}" onchange="S.prices['${p.id}']=+this.value;save()"></div>`).join('')}</div></div>`;
  return `<p style="color:var(--mu)">${t('ptext')}</p>`+g('pppoe',t('pp_title'))+g('hotspot',t('hs_title'))}
function rep(){
  const m=rm,hp=mp(m,'hotspot'),pp=mp(m,'pppoe'),ex=S.expenses.filter(x=>x.date.startsWith(m));
  const h=sum(hp),p=sum(pp),e=sum(ex),paid=new Set(mp(m).map(x=>x.cid));
  const un=S.customers.filter(c=>c.type==='pppoe'&&!paid.has(c.id)&&(c.date||'').slice(0,7)<=m);
  const rows=a=>a.map(x=>`<tr><td>${x.date}</td><td>${esc(cust(x.cid)?.name)}</td><td>${pname(cust(x.cid)?.pkg)}</td><td>${money(x.amount)}</td><td>${esc(x.note)}</td></tr>`).join('')||'<tr><td colspan=5>—</td></tr>';
  const tb=a=>`<div class="tw"><table><tr><th>${t('date')}</th><th>${t('customer')}</th><th>${t('pkg')}</th><th>${t('amount')}</th><th>${t('note')}</th></tr>${rows(a)}</table></div>`;
  return `<div class="card np"><label>${t('month')}</label><input type="month" value="${m}" onchange="rm=this.value;render()"><div class="row"><button class="btn" onclick="doPrint()">${t('print')}</button><button class="btn" onclick="dlReport()">${t('dl')}</button><button class="btn" onclick="dlCsv()">${t('csv')}</button></div><p style="color:var(--mu);font-size:13px">${t('dlnote')}</p></div>
  <div id="repbox"><h3>${t('report_of')} ${m} — VitalTelecom</h3>
  <div class="grid"><div class="stat"><span>PPPoE (${pp.length})</span><b>${money(p)}</b></div><div class="stat h"><span>${t('hotspot')} (${hp.length})</span><b>${money(h)}</b></div>
  <div class="stat"><span>${t('total')}</span><b>${money(h+p)}</b></div><div class="stat"><span>${t('expense')}</span><b class="bad">${money(e)}</b></div><div class="stat"><span>${t('net')}</span><b class="${h+p-e>=0?'ok':'bad'}">${money(h+p-e)}</b></div></div>
  <div class="card"><h3>${t('col_pppoe')}</h3>${tb(pp)}</div><div class="card"><h3>${t('col_hotspot')}</h3>${tb(hp)}</div>
  <div class="card"><h3>${t('unpaid')} (${un.length}) — ${money(un.reduce((s,c)=>s+c.fee,0))}</h3><div class="tw"><table><tr><th>${t('name')}</th><th>${t('pkg')}</th><th>${t('phone')}</th><th>${t('fee')}</th></tr>
  ${un.map(c=>`<tr><td>${esc(c.name)}</td><td>${pname(c.pkg)}</td><td>${esc(c.phone)}</td><td>${money(c.fee)}</td></tr>`).join('')||`<tr><td colspan=4>${t('allpaid')}</td></tr>`}</table></div></div></div>`;
}
function doPrint(){try{window.print()}catch(e){}}
function save2(name,data){const u=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function dlReport(){
  const css='body{font-family:Tahoma,Arial,sans-serif;padding:20px;color:#111}table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:13px}th,td{border:1px solid #ccc;padding:6px;text-align:start}.grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.stat{border:1px solid #ccc;padding:10px;border-radius:8px;min-width:130px}.stat b{display:block;font-size:18px}.card{margin-bottom:12px}';
  save2('VitalTelecom-report-'+rm+'.html',`<!DOCTYPE html><html lang="${lang}" dir="${lang==='ps'?'rtl':'ltr'}"><head><meta charset="utf-8"><title>VitalTelecom ${rm}</title><style>${css}</style></head><body>${$('repbox').innerHTML}</body></html>`);
}
function dlCsv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',m=rm;
  const r=[['Type','Date','Customer','Package','Month','Amount','Note']];
  mp(m).forEach(p=>{const c=cust(p.cid)||{};r.push([c.type,p.date,c.name,pname(c.pkg),p.month,p.amount,p.note])});
  S.expenses.filter(x=>x.date.startsWith(m)).forEach(x=>r.push(['expense',x.date,x.desc,'',m,x.amount,x.note]));
  save2('VitalTelecom-'+m+'.csv','\ufeff'+r.map(a=>a.map(q).join(',')).join('\n'));
}
function render(){
  chrome();
  if(phase==='load')return msg('⏳',t('loading'));
    if(phase==='signup')return authView(true);
  if(phase==='login')return authView(false);
  if(!ready)return;
  nav();$('app').innerHTML=({dash,reg,col,exp,rep,prc}[tab])();scrollTo(0,0);
}
init();
</script>
</body>
</html>
